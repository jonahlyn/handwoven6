name: PR Checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-html:
    name: Validate HTML
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install html-validate
        run: npm install --global html-validate

      - name: Validate HTML files
        run: |
          echo "Validating HTML files..."
          html_files=$(find . \
            -name "*.html" \
            -not -path "./.git/*" \
            -not -path "./node_modules/*")

          if [ -z "$html_files" ]; then
            echo "No HTML files found."
            exit 0
          fi

          echo "$html_files"
          html-validate $html_files

  lint-css:
    name: Lint CSS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stylelint
        run: npm install --global stylelint stylelint-config-standard

      - name: Create stylelint config
        run: |
          echo '{"extends":["stylelint-config-standard"]}' > .stylelintrc.json

      - name: Lint CSS files
        run: |
          css_files=$(find . \
            -name "*.css" \
            -not -path "./.git/*" \
            -not -path "./node_modules/*")

          if [ -z "$css_files" ]; then
            echo "No CSS files found."
            exit 0
          fi

          echo "$css_files"
          stylelint $css_files

  check-links:
    name: Check Internal Links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lychee (link checker)
        uses: lycheeverse/lychee-action@v2
        with:
          # Check only local file links; skip external URLs in CI
          args: >
            --offline
            --verbose
            --no-progress
            '**/*.html'
          fail: true
