name: PR Checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: npm install --global html-validate stylelint stylelint-config-standard

      - name: Create stylelint config
        run: echo '{"extends":["stylelint-config-standard"]}' > .stylelintrc.json

      - name: Validate HTML
        run: |
          html_files=$(find . -name "*.html" \
            -not -path "./.git/*" -not -path "./node_modules/*")
          if [ -n "$html_files" ]; then
            html-validate $html_files
          else
            echo "No HTML files found, skipping."
          fi

      - name: Lint CSS
        run: |
          css_files=$(find . -name "*.css" \
            -not -path "./.git/*" -not -path "./node_modules/*")
          if [ -n "$css_files" ]; then
            stylelint $css_files
          else
            echo "No CSS files found, skipping."
          fi

      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --verbose --no-progress '**/*.html'
          fail: true
